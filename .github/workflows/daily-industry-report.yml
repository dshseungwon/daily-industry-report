name: Daily Industry Report

# WHAT THIS DOES
# GitHub runs this on its own servers. It installs Claude Code, hands it the
# instructions in prompts/daily-industry-report.md, lets it build + fact-check
# today's 7 reports, commits and pushes them (GitHub Pages serves the result),
# then emails you a morning digest (7 one-liners + 1 deep pick). No laptop required.

on:
  # Daily schedule is ON. GitHub cron is ALWAYS UTC. 21:00 UTC == 06:00 KST next morning.
  schedule:
    - cron: "0 21 * * *"   # 21:00 UTC == 06:00 KST (다음날 아침)
  workflow_dispatch:       # 수동 실행. override_date 지정 시 그 날짜로 강제 생성(기존 배치 무시)
    inputs:
      override_date:
        description: "Force-generate for this date (YYYY-MM-DD), ignoring existing batches"
        required: false
        default: ""

concurrency:
  group: daily-industry-report
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90   # our own cap. GitHub's hard limit is 6h; this kills a stuck run sooner.
    env:
      TZ: Asia/Seoul   # report DATES use Korea time, matching the commit message (fixes UTC date lag)
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node (Claude Code + build_index.js)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python (HTML generator)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rotation gate (finalize + stop when the 163 sub-industry lap completes)
        id: gate
        run: |
          if [ -f .rotation-complete ]; then
            echo "Rotation already complete and stopped. Nothing to do."
            echo "run=skip" >> "$GITHUB_OUTPUT"; exit 0
          fi
          COMPLETE=$(node -e 'const r=require("./reports.json");const sub=require("./subindustries.json");const c=new Set(r.filter(x=>String(x.gics).length===8).map(x=>String(x.gics)));process.stdout.write(c.size>=sub.length?"yes":"no")')
          if [ "$COMPLETE" = "yes" ]; then
            echo "All 163 sub-industries covered -> one-time cleanup, then stop."
            node build/finalize.js
            git config user.name "Daily Industry Report Bot"
            git config user.email "daily-industry-report@users.noreply.github.com"
            git add -A
            if git diff --cached --quiet; then echo "nothing to clean"; else git commit -m "Rotation complete: cleanup + stop auto-publishing"; git push; fi
            echo "run=skip" >> "$GITHUB_OUTPUT"
          else
            echo "run=generate" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Claude Code
        if: steps.gate.outputs.run == 'generate'
        run: npm install -g @anthropic-ai/claude-code

      - name: Generate + fact-check today's reports
        if: steps.gate.outputs.run == 'generate'
        env:
          # Max/Pro subscription auth. Run `claude setup-token` locally and store the
          # resulting sk-ant-oat01-... value as the CLAUDE_CODE_OAUTH_TOKEN secret.
          # This runs on your Max plan's agent credit, NOT separate pay-as-you-go API billing.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_MODEL: opus   # set to "sonnet" to cut cost; "opus" for best quality
        run: |
          set +e
          OVR="${{ github.event.inputs.override_date }}"
          if [ -z "$OVR" ]; then
            # No manual override -> publish the NEXT sequential date = latest reports/<date>/ + 1 day.
            # (Decoupled from the real calendar so pre-pulled dates don't collide and publishing keeps marching forward.)
            LAST=$(ls -1d reports/2*-*-* 2>/dev/null | sed 's#.*/##' | sort | tail -1)
            [ -n "$LAST" ] && OVR=$(date -d "$LAST +1 day" +%Y-%m-%d)
            echo "AUTO SEQUENTIAL DATE (latest ${LAST:-none} + 1): ${OVR:-fallback-real-date}"
          fi
          if [ -n "$OVR" ]; then
            printf 'OVERRIDE: Treat today'"'"'s date as %s. Do NOT run the date command; use %s for the reports/<date>/ folder and every date field and reports.json entry. Generate the next 7 uncovered sub-industries per the rotation for %s, even if other dates already have batches. All instructions below still apply.\n\n' "$OVR" "$OVR" "$OVR" > run_prompt.txt
            cat prompts/daily-industry-report.md >> run_prompt.txt
            echo "PUB DATE: $OVR"
            echo "PUB_DATE=$OVR" >> "$GITHUB_ENV"
          else
            cp prompts/daily-industry-report.md run_prompt.txt
          fi
          # --output-format json returns a final JSON with usage + cost after the agent finishes its work
          claude -p "$(cat run_prompt.txt)" \
            --model "$CLAUDE_MODEL" \
            --dangerously-skip-permissions \
            --output-format json > claude_result.json
          echo "claude exit: $?"
          node -e '
            const fs=require("fs");
            let j={}; try{ j=JSON.parse(fs.readFileSync("claude_result.json","utf8")); }catch(e){ console.log("no json:",e.message); }
            const u=j.usage||{};
            const cols=[new Date().toISOString(), j.num_turns||"", j.duration_ms||"", u.input_tokens||"", u.output_tokens||"", u.cache_creation_input_tokens||"", u.cache_read_input_tokens||"", (j.total_cost_usd!=null?j.total_cost_usd:"")];
            const f="usage-log.csv";
            if(!fs.existsSync(f)) fs.writeFileSync(f,"utc,num_turns,duration_ms,input_tokens,output_tokens,cache_creation_tokens,cache_read_tokens,total_cost_usd\n");
            fs.appendFileSync(f, cols.join(",")+"\n");
            console.log("USAGE ROW:", cols.join(","));
          '
          rm -f claude_result.json run_prompt.txt

      - name: Build game_data.json (Industry Hegemon game data)
        if: steps.gate.outputs.run == 'generate'
        run: |
          # 발행된 HTML에서 게임용 실데이터(KSF·글로벌/한국 점유율)를 추출 → game_data.json.
          # stdlib만 사용(의존성 없음). 다음 'Commit & push'의 git add -A 가 함께 게시(Pages 루트).
          python3 build/game_data.py || echo "game_data update skipped (non-fatal)"

      - name: Commit & push
        if: steps.gate.outputs.run == 'generate'
        run: |
          git config user.name "Daily Industry Report Bot"
          git config user.email "daily-industry-report@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish today."
          else
            git commit -m "Publish reports ${PUB_DATE:-$(TZ=Asia/Seoul date +%Y-%m-%d)}"
            git push
          fi

      - name: Nudge GitHub Pages deploy (legacy Pages sometimes sticks on "building")
        if: steps.gate.outputs.run == 'generate'
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds")
          echo "pages build request -> HTTP $code"
          # 202 = accepted (a fresh build was queued); other codes are non-fatal
          exit 0

      - name: Prepare digest
        if: steps.gate.outputs.run == 'generate'
        run: |
          # Fallback if Claude did not produce the digest, so the email step never hard-fails.
          if [ ! -s digest.html ]; then
            echo "<p>오늘 다이제스트 생성에 실패했습니다. Actions 로그를 확인하세요.</p>" > digest.html
          fi
          SUBJ="$(head -n1 digest_subject.txt 2>/dev/null || true)"
          [ -z "$SUBJ" ] && SUBJ="The Industry Brief 다이제스트 $(TZ=Asia/Seoul date +%Y-%m-%d)"
          echo "DIGEST_SUBJECT=$SUBJ" >> "$GITHUB_ENV"

      - name: Email the morning digest
        if: success() && steps.gate.outputs.run == 'generate'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: The Industry Brief <${{ secrets.MAIL_USERNAME }}>
          to: dshseungwon@gmail.com
          subject: ${{ env.DIGEST_SUBJECT }}
          html_body: file://digest.html
