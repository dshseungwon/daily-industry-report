name: Daily Industry Report

# WHAT THIS DOES
# GitHub runs this on its own servers. It installs Claude Code, hands it the
# instructions in prompts/daily-industry-report.md, lets it build + fact-check
# today's 7 reports, commits and pushes them (GitHub Pages serves the result),
# then emails you a morning digest (7 one-liners + 1 deep pick). No laptop required.

on:
  # Daily schedule is ON. GitHub cron is ALWAYS UTC. 21:00 UTC == 06:00 KST next morning.
  schedule:
    - cron: "0 21 * * *"   # 21:00 UTC == 06:00 KST (다음날 아침)
  workflow_dispatch: {}    # 수동 실행 버튼도 그대로 유지

concurrency:
  group: daily-industry-report
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90   # our own cap. GitHub's hard limit is 6h; this kills a stuck run sooner.
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node (Claude Code + build_index.js)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python (HTML generator)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Generate + fact-check today's reports
        env:
          # Max/Pro subscription auth. Run `claude setup-token` locally and store the
          # resulting sk-ant-oat01-... value as the CLAUDE_CODE_OAUTH_TOKEN secret.
          # This runs on your Max plan's agent credit, NOT separate pay-as-you-go API billing.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_MODEL: opus   # set to "sonnet" to cut cost; "opus" for best quality
        run: |
          claude -p "$(cat prompts/daily-industry-report.md)" \
            --model "$CLAUDE_MODEL" \
            --dangerously-skip-permissions \
            --verbose

      - name: Commit & push
        run: |
          git config user.name "Daily Industry Report Bot"
          git config user.email "daily-industry-report@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish today."
          else
            git commit -m "Publish reports $(TZ=Asia/Seoul date +%Y-%m-%d)"
            git push
          fi

      - name: Prepare digest
        run: |
          # Fallback if Claude did not produce the digest, so the email step never hard-fails.
          if [ ! -s digest.html ]; then
            echo "<p>오늘 다이제스트 생성에 실패했습니다. Actions 로그를 확인하세요.</p>" > digest.html
          fi
          SUBJ="$(head -n1 digest_subject.txt 2>/dev/null || true)"
          [ -z "$SUBJ" ] && SUBJ="The Industry Brief 다이제스트 $(TZ=Asia/Seoul date +%Y-%m-%d)"
          echo "DIGEST_SUBJECT=$SUBJ" >> "$GITHUB_ENV"

      - name: Email the morning digest
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: The Industry Brief <${{ secrets.MAIL_USERNAME }}>
          to: dshseungwon@gmail.com
          subject: ${{ env.DIGEST_SUBJECT }}
          html_body: file://digest.html
